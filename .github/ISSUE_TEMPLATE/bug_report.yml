name: 不具合の報告
description: うまく動かないことを知らせる
title: "[不具合] "
labels: ["不具合"]
body:
  - type: markdown
    attributes:
      value: |
        **この Issue は誰でも読めます。** 未加工のログ、氏名や勤務先などの個人情報、パスワードやトークンなどの認証情報は書かないでください。
        **まだ公表されていない脆弱性は、この Issue ではなく [Security タブの Private Vulnerability Reporting](https://github.com/poola-vii/support/security/advisories/new) から送ってください。**

  - type: dropdown
    id: product
    attributes:
      label: 製品
      options:
        - TwoTile
        - Nintimer
    validations:
      required: true

  - type: dropdown
    id: edition
    attributes:
      label: どちらの版か
      options:
        - Microsoft Store 版
        - ポータブル版（単一 EXE）
        - 分からない
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 製品の版
      description: "タスクトレイメニューのいちばん上に出ます（例: `TwoTile v0.4.0`）。"
      placeholder: TwoTile v0.4.0
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows の版
      description: 「設定 > システム > バージョン情報」の「エディション」「バージョン」「OS ビルド」。
      placeholder: Windows 11 Home / 25H2 / 26200.xxxx
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 何をしたら、何が起きたか
      description: 期待していたことと、実際に起きたことを書いてください。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 再現する手順
      description: 分かる範囲で、順番に書いてください。
      placeholder: |
        1. ウィンドウを3つ開く
        2. …
    validations:
      required: false

  - type: textarea
    id: displays
    attributes:
      label: 画面の構成
      description: ディスプレイの数と、それぞれの解像度・表示倍率（「設定 > システム > ディスプレイ」）。
      placeholder: 2台。メイン 2560x1440 150%、サブ 1920x1080 100%
    validations:
      required: false

  - type: textarea
    id: log
    attributes:
      label: ログ（任意）
      description: |
        タスクトレイの「デバッグ表示」から取り出せます（[ログ採取方法](https://poola-vii.github.io/twotile/log_collection.html)）。
        **貼る前に必ずご自身で読み、渡したくない部分を消してください。** ウィンドウのタイトルが含まれます。
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 確認
      options:
        - label: 貼り付けた内容に、渡したくない情報（ウィンドウのタイトル、ファイルのパス、個人情報、認証情報）が含まれていないか確かめました
          required: true
        - label: 配布されている最新の版で起きることを確かめました（古い版はサポートの対象外です）
          required: false
        - label: 既知の制限を読みました
          required: false
