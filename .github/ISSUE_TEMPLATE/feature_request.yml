name: 要望
description: こうなってほしいことを伝える
title: "[要望] "
labels: ["要望"]
body:
  - type: markdown
    attributes:
      value: |
        **この Issue は誰でも読めます。** 個人情報や認証情報は書かないでください。

        **いただいた要望を入れるとはお約束できません。** 入れないと決めることもあります。その場合は理由をお返しします（[サポート範囲](https://poola-vii.github.io/twotile/support.html)）。
        [既知の制限](https://poola-vii.github.io/twotile/known_issues.html)の「仕様として、そうしていること」に挙げたものは、理由があってそうしています。ご意見はうかがいます。

  - type: dropdown
    id: product
    attributes:
      label: 製品
      options:
        - TwoTile
        - Nintimer
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 困っていること
      description: "**どうしてほしいか**より先に、**何に困っているか**を書いていただけると助かります。"
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: こうなってほしい（任意）
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 確認
      options:
        - label: 書いた内容に、渡したくない情報（個人情報、認証情報、ウィンドウのタイトル）が含まれていないか確かめました
          required: true
